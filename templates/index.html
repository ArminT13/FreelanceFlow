<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreelanceFlow | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto space-y-6">

        <!-- Top Header & Income Stats -->
        <header class="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-slate-800 gap-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-white flex items-center gap-2">
                    ⚡ FreelanceFlow
                </h1>
                <p class="text-slate-400 text-sm mt-1">Manage clients, track projects, and monitor your income.</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-slate-800 border border-slate-700/60 rounded-xl p-4 min-w-[150px]">
                    <div class="text-xs uppercase text-slate-400 font-semibold tracking-wider">Total Pipeline</div>
                    <div id="statTotal" class="text-2xl font-bold text-white mt-1">$0</div>
                </div>
                <div class="bg-emerald-950/40 border border-emerald-500/30 rounded-xl p-4 min-w-[150px]">
                    <div class="text-xs uppercase text-emerald-400 font-semibold tracking-wider">Realized Income</div>
                    <div id="statRealized" class="text-2xl font-bold text-emerald-400 mt-1">$0</div>
                </div>
            </div>
        </header>

        <!-- Forms Grid: Add Client & Add Project -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- New Client Form -->
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 shadow-lg backdrop-blur">
                <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
                    <span>👤</span> New Client
                </h2>
                <form id="clientForm" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Client Name *</label>
                        <input type="text" id="clientName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="Acme Studio">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Email</label>
                            <input type="email" id="clientEmail" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="contact@acme.com">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Phone</label>
                            <input type="text" id="clientPhone" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="+123456789">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 transition py-2 px-4 rounded-lg text-sm font-medium text-white shadow">
                        Add Client
                    </button>
                </form>
            </div>

            <!-- New Project Form -->
            <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-5 shadow-lg backdrop-blur">
                <h2 class="text-lg font-semibold text-white mb-4 flex items-center gap-2">
                    <span>🚀</span> New Project
                </h2>
                <form id="projectForm" class="space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Client *</label>
                            <select id="projectClient" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                                <option value="" disabled selected>Select client...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Budget ($)</label>
                            <input type="number" id="projectBudget" min="0" step="50" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="1000">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Project Title *</label>
                        <input type="text" id="projectTitle" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="Mobile App Redesign">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Deadline</label>
                            <input type="date" id="projectDeadline" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Status</label>
                            <select id="projectStatus" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                                <option value="in_progress">In Progress</option>
                                <option value="pending">Pending</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 transition py-2 px-4 rounded-lg text-sm font-medium text-white shadow">
                        Add Project
                    </button>
                </form>
            </div>
        </div>

        <!-- Projects Table -->
        <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl overflow-hidden shadow-lg">
            <div class="p-5 border-b border-slate-700/60 flex items-center justify-between">
                <h2 class="text-lg font-semibold text-white flex items-center gap-2">
                    <span>📋</span> All Projects
                </h2>
                <button onclick="refreshData()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg transition">
                    ↻ Refresh
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/60 text-xs uppercase text-slate-400">
                        <tr>
                            <th class="px-5 py-3">Title</th>
                            <th class="px-5 py-3">Client</th>
                            <th class="px-5 py-3">Budget</th>
                            <th class="px-5 py-3">Deadline</th>
                            <th class="px-5 py-3">Status</th>
                            <th class="px-5 py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="projectsTableBody" class="divide-y divide-slate-700/40">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Frontend Logic -->
    <script>
        async function fetchStats() {
            const res = await fetch('/stats/income');
            const data = await res.json();
            document.getElementById('statTotal').innerText = `$${Number(data.total_budget).toLocaleString()}`;
            document.getElementById('statRealized').innerText = `$${Number(data.realized_income).toLocaleString()}`;
        }

        async function fetchClients() {
            const res = await fetch('/clients');
            const clients = await res.json();
            const select = document.getElementById('projectClient');
            select.innerHTML = '<option value="" disabled selected>Select client...</option>';
            clients.forEach(c => {
                select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
            });
        }

        async function fetchProjects() {
            const res = await fetch('/projects');
            const projects = await res.json();
            const tbody = document.getElementById('projectsTableBody');
            tbody.innerHTML = '';

            if (projects.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-500">No projects found. Add one above!</td></tr>`;
                return;
            }

            projects.forEach(p => {
                const statusBadge = {
                    'completed': '<span class="px-2.5 py-1 text-xs rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Completed</span>',
                    'in_progress': '<span class="px-2.5 py-1 text-xs rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30">In Progress</span>',
                    'pending': '<span class="px-2.5 py-1 text-xs rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30">Pending</span>'
                }[p.status] || p.status;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="px-5 py-4 font-medium text-white">${p.title}</td>
                        <td class="px-5 py-4 text-slate-400">${p.client_name}</td>
                        <td class="px-5 py-4 font-semibold text-slate-200">$${Number(p.budget).toLocaleString()}</td>
                        <td class="px-5 py-4 text-slate-400 text-xs">${p.deadline || '-'}</td>
                        <td class="px-5 py-4">${statusBadge}</td>
                        <td class="px-5 py-4 text-right space-x-2">
                            ${p.status !== 'completed' ? `
                                <button onclick="markCompleted(${p.id})" class="text-xs bg-emerald-700/50 hover:bg-emerald-600 text-emerald-200 px-2 py-1 rounded transition">
                                    ✓ Complete
                                </button>
                            ` : ''}
                            <button onclick="deleteProject(${p.id})" class="text-xs bg-rose-900/50 hover:bg-rose-700 text-rose-200 px-2 py-1 rounded transition">
                                ✕ Delete
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        async function markCompleted(id) {
            await fetch(`/projects/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'completed' })
            });
            refreshData();
        }

        async function deleteProject(id) {
            if (!confirm('Are you sure you want to delete this project?')) return;
            await fetch(`/projects/${id}`, { method: 'DELETE' });
            refreshData();
        }

        document.getElementById('clientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                name: document.getElementById('clientName').value,
                email: document.getElementById('clientEmail').value,
                phone: document.getElementById('clientPhone').value
            };
            const res = await fetch('/clients', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (res.ok) {
                e.target.reset();
                refreshData();
            } else {
                alert('Failed to add client');
            }
        });

        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                client_id: document.getElementById('projectClient').value,
                title: document.getElementById('projectTitle').value,
                budget: parseFloat(document.getElementById('projectBudget').value) || 0,
                deadline: document.getElementById('projectDeadline').value,
                status: document.getElementById('projectStatus').value
            };
            const res = await fetch('/projects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (res.ok) {
                e.target.reset();
                refreshData();
            } else {
                alert('Failed to add project');
            }
        });

        function refreshData() {
            fetchStats();
            fetchClients();
            fetchProjects();
        }

        // Initial load
        refreshData();
    </script>
</body>
</html>
